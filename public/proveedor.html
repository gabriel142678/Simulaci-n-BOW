<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proveedor - Gestión de Pedidos</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f7fafc;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 { color: #1a202c; font-size: 28px; margin-bottom: 10px; }
    .instrucciones {
      background: #ebf8ff;
      border: 1px solid #bee3f8;
      color: #2b6cb0;
      padding: 10px 20px;
      border-radius: 6px;
      margin-bottom: 25px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }

    .pedidos-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 25px; }

    .tarjeta-pedido {
      background: white;
      border-radius: 8px;
      padding: 24px;
      border: 2px solid #cbd5e0;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06);
      border-left: 6px solid #a0aec0;
      outline: none;
      transition: border-color 0.2s;
    }

    .tarjeta-pedido.orden-activa {
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.3);
    }

    .tarjeta-pedido.recibido { border-left-color: #d69e2e; }
    .tarjeta-pedido.despachado { border-left-color: #38a169; }

    .header-pedido {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }

    .titulo-orden { font-size: 22px; font-weight: bold; color: #1a365d; }
    .badge-tipo {
      background-color: #2b6cb0;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    /* Tabla con únicamente 2 columnas */
    table.tabla-piezas {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
      font-size: 15px;
    }

    table.tabla-piezas th {
      background-color: #205493;
      color: white;
      padding: 12px 15px;
      font-weight: bold;
      border: 1px solid #1a365d;
    }

    table.tabla-piezas td {
      border: 1px solid #cbd5e0;
      padding: 12px 15px;
      color: #2d3748;
      transition: background-color 0.15s ease;
    }

    table.tabla-piezas td.col-desc { text-align: left; }
    table.tabla-piezas td.col-cant { text-align: center; font-weight: bold; font-size: 16px; }

    table.tabla-piezas tr:nth-child(even) { background-color: #f8fafc; }

    /* RESALTADO DE LA FILA SELECCIONADA POR TECLADO */
    table.tabla-piezas tr.fila-seleccionada td {
      background-color: #fef08a !important;
      color: #742a2a !important;
      font-weight: bold;
      border-top: 2px solid #d69e2e !important;
      border-bottom: 2px solid #d69e2e !important;
    }

    table.tabla-piezas tr.fila-total {
      font-weight: bold;
      background-color: #edf2f7;
    }

    table.tabla-piezas tr.fila-total td {
      border-top: 2px solid #205493;
      font-size: 16px;
      padding: 12px 15px;
    }

    .navegacion-piezas {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      background: #f7fafc;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      align-items: center;
      justify-content: space-between;
    }

    .btn-nav {
      background-color: #4a5568;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-nav:hover { background-color: #2d3748; }

    .acciones-btn { display: flex; gap: 15px; margin-top: 15px; }

    button.btn-accion {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-recibir { background-color: #d69e2e; color: white; }
    .btn-despachar { background-color: #38a169; color: white; }
    .btn-deshabilitado { background-color: #cbd5e0 !important; cursor: not-allowed; }

    .estado-texto-prov { font-weight: bold; margin-top: 12px; font-size: 15px; }
  </style>
</head>
<body>

  <h2>Proveedor: Solicitudes de Piezas</h2>
  <div class="instrucciones">
    💡 Usa las <strong>flechas Abajo (↓) y Arriba (↑)</strong> de tu teclado para moverte por las piezas de la orden activa.
  </div>

  <div class="pedidos-container" id="lista-pedidos"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let ordenSeleccionadaId = null;

    socket.on('cargar_pedidos_iniciales', (pedidos) => {
      const contenedor = document.getElementById('lista-pedidos');
      contenedor.innerHTML = '';
      pedidos.forEach(orden => agregarTarjetaProveedor(orden));
      
      if (pedidos.length > 0) {
        activarOrden(pedidos[0].id);
      }
    });

    socket.on('nuevo_pedido_proveedor', (orden) => {
      agregarTarjetaProveedor(orden);
      if (!ordenSeleccionadaId) {
        activarOrden(orden.id);
      }
    });

    function activarOrden(idOrden) {
      ordenSeleccionadaId = idOrden;
      document.querySelectorAll('.tarjeta-pedido').forEach(tarjeta => {
        tarjeta.classList.remove('orden-activa');
      });
      const tarjeta = document.getElementById(`prov-orden-${idOrden}`);
      if (tarjeta) {
        tarjeta.classList.add('orden-activa');
      }
    }

    function agregarTarjetaProveedor(orden) {
      const contenedor = document.getElementById('lista-pedidos');

      let filasHTML = '';
      if (orden.piezas && orden.piezas.length > 0) {
        orden.piezas.forEach((p, idx) => {
          filasHTML += `
            <tr class="fila-pieza" data-idx="${idx}">
              <td class="col-desc">${p.descripcion}</td>
              <td class="col-cant">${p.cantidadTotal}</td>
            </tr>
          `;
        });

        filasHTML += `
          <tr class="fila-total">
            <td style="text-align: right; padding-right: 15px;">TOTAL PIEZAS:</td>
            <td class="col-cant">${orden.totalPiezas}</td>
          </tr>
        `;
      }

      let claseEstado = '';
      let estadoTxt = 'Pendiente de confirmación';
      let btnRecibirAttr = 'class="btn-accion btn-recibir"';
      let btnDespacharAttr = 'disabled class="btn-accion btn-despachar btn-deshabilitado"';

      if (orden.estado === 'Recibido') {
        claseEstado = 'recibido';
        estadoTxt = 'Pedido Recibido (En preparación)';
        btnRecibirAttr = 'disabled class="btn-accion btn-recibir btn-deshabilitado"';
        btnDespacharAttr = 'class="btn-accion btn-despachar"';
      } else if (orden.estado === 'En Camino') {
        claseEstado = 'despachado';
        estadoTxt = 'Orden Despachada y En Camino';
        btnRecibirAttr = 'disabled class="btn-accion btn-recibir btn-deshabilitado"';
        btnDespacharAttr = 'disabled class="btn-accion btn-despachar btn-deshabilitado"';
      }

      const cardHTML = `
        <div class="tarjeta-pedido ${claseEstado}" id="prov-orden-${orden.id}" onclick="activarOrden(${orden.id})">
          <div class="header-pedido">
            <span class="titulo-orden">Orden #${orden.id}</span>
            <span class="badge-tipo">${orden.zona}</span>
          </div>

          <div class="navegacion-piezas">
            <span style="font-size:13px; color:#4a5568;">Control de Piezas (Teclado/Botones):</span>
            <div>
              <button class="btn-nav" onclick="event.stopPropagation(); moverSeleccion(${orden.id}, -1)">↑ Anterior Pieza</button>
              <button class="btn-nav" onclick="event.stopPropagation(); moverSeleccion(${orden.id}, 1)">↓ Siguiente Pieza</button>
            </div>
          </div>

          <table class="tabla-piezas">
            <thead>
              <tr>
                <th style="text-align: left;">Descripción Componente</th>
                <th style="width: 140px;">Cantidad</th>
              </tr>
            </thead>
            <tbody>
              ${filasHTML}
            </tbody>
          </table>

          <div class="acciones-btn">
            <button id="btn-recibir-${orden.id}" ${btnRecibirAttr} onclick="event.stopPropagation(); marcarRecibido(${orden.id})">
              1. Confirmar Recibido
            </button>
            <button id="btn-despachar-${orden.id}" ${btnDespacharAttr} onclick="event.stopPropagation(); marcarDespachado(${orden.id})">
              2. Enviar / En Camino
            </button>
          </div>

          <div class="estado-texto-prov" id="estado-prov-${orden.id}">${estadoTxt}</div>
        </div>
      `;

      contenedor.innerHTML += cardHTML;
    }

    function moverSeleccion(idOrden, direccion) {
      activarOrden(idOrden);
      const tarjeta = document.getElementById(`prov-orden-${idOrden}`);
      if (!tarjeta) return;

      const filas = tarjeta.querySelectorAll('tbody tr.fila-pieza');
      if (filas.length === 0) return;

      let idxActual = -1;
      filas.forEach((f, index) => {
        if (f.classList.contains('fila-seleccionada')) {
          idxActual = index;
        }
      });

      let nuevoIdx = idxActual + direccion;

      if (nuevoIdx < 0) nuevoIdx = 0;
      if (nuevoIdx >= filas.length) nuevoIdx = filas.length - 1;

      filas.forEach(f => f.classList.remove('fila-seleccionada'));
      filas[nuevoIdx].classList.add('fila-seleccionada');
      filas[nuevoIdx].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (ordenSeleccionadaId) {
          moverSeleccion(ordenSeleccionadaId, 1);
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (ordenSeleccionadaId) {
          moverSeleccion(ordenSeleccionadaId, -1);
        }
      }
    });

    function marcarRecibido(id) { socket.emit('pedido_recibido', id); }
    function marcarDespachado(id) { socket.emit('despachar_pedido', id); }

    socket.on('orden_recibida_proveedor', (id) => {
      const tarjeta = document.getElementById(`prov-orden-${id}`);
      const btnRecibir = document.getElementById(`btn-recibir-${id}`);
      const btnDespachar = document.getElementById(`btn-despachar-${id}`);
      const estadoTxt = document.getElementById(`estado-prov-${id}`);

      if (tarjeta) {
        tarjeta.className = "tarjeta-pedido recibido orden-activa";
        btnRecibir.disabled = true;
        btnRecibir.className = "btn-accion btn-recibir btn-deshabilitado";
        btnDespachar.disabled = false;
        btnDespachar.className = "btn-accion btn-despachar";
        estadoTxt.innerText = "Pedido Recibido (En preparación)";
      }
    });

    socket.on('orden_despachada_proveedor', (id) => {
      const tarjeta = document.getElementById(`prov-orden-${id}`);
      const btnDespachar = document.getElementById(`btn-despachar-${id}`);
      const estadoTxt = document.getElementById(`estado-prov-${id}`);

      if (tarjeta) {
        tarjeta.className = "tarjeta-pedido despachado orden-activa";
        btnDespachar.disabled = true;
        btnDespachar.className = "btn-accion btn-despachar btn-deshabilitado";
        estadoTxt.innerText = "Orden Despachada y En Camino";
      }
    });
  </script>
</body>
</html>
