<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proveedor - Gestión de Pedidos</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f7fafc;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 { color: #1a202c; font-size: 28px; margin-bottom: 30px; }
    .pedidos-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 25px; }

    .tarjeta-pedido {
      background: white;
      border-radius: 8px;
      padding: 24px;
      border: 1px solid #cbd5e0;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06);
      border-left: 6px solid #a0aec0;
    }

    .tarjeta-pedido.recibido { border-left-color: #d69e2e; }
    .tarjeta-pedido.despachado { border-left-color: #38a169; }

    .header-pedido {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }

    .titulo-orden { font-size: 22px; font-weight: bold; color: #1a365d; }
    .badge-tipo {
      background-color: #2b6cb0;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    /* Estilo de la tabla de referencia */
    table.tabla-piezas {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
      font-size: 14px;
    }

    table.tabla-piezas th {
      background-color: #205493;
      color: white;
      text-align: center;
      padding: 10px 8px;
      font-weight: bold;
      border: 1px solid #1a365d;
    }

    table.tabla-piezas td {
      border: 1px solid #cbd5e0;
      padding: 8px 10px;
      text-align: center;
      color: #2d3748;
    }

    table.tabla-piezas td.col-desc {
      text-align: left;
    }

    table.tabla-piezas tr:nth-child(even) {
      background-color: #f8fafc;
    }

    table.tabla-piezas tr.fila-total {
      font-weight: bold;
      background-color: #edf2f7;
    }

    table.tabla-piezas tr.fila-total td {
      border-top: 2px solid #205493;
      font-size: 15px;
    }

    .acciones-btn { display: flex; gap: 15px; margin-top: 15px; }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-recibir { background-color: #d69e2e; color: white; }
    .btn-despachar { background-color: #38a169; color: white; }
    .btn-deshabilitado { background-color: #cbd5e0 !important; cursor: not-allowed; }

    .estado-texto-prov { font-weight: bold; margin-top: 12px; font-size: 15px; }
  </style>
</head>
<body>

  <h2>Proveedor: Solicitudes de Piezas</h2>
  <div class="pedidos-container" id="lista-pedidos"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    socket.on('cargar_pedidos_iniciales', (pedidos) => {
      const contenedor = document.getElementById('lista-pedidos');
      contenedor.innerHTML = '';
      // Se cargan en el orden natural del arreglo (1, 2, 3...)
      pedidos.forEach(orden => agregarTarjetaProveedor(orden));
    });

    socket.on('nuevo_pedido_proveedor', (orden) => {
      // Se agrega siempre al final para respetar la llegada
      agregarTarjetaProveedor(orden);
    });

    function agregarTarjetaProveedor(orden) {
      const contenedor = document.getElementById('lista-pedidos');

      let filasHTML = '';
      if (orden.piezas && orden.piezas.length > 0) {
        orden.piezas.forEach(p => {
          filasHTML += `
            <tr>
              <td>${p.codigo}</td>
              <td>${p.color}</td>
              <td>${p.pines}</td>
              <td class="col-desc">${p.descripcion}</td>
              <td style="font-weight: bold;">${p.cantidadTotal}</td>
            </tr>
          `;
        });

        filasHTML += `
          <tr class="fila-total">
            <td colspan="4" style="text-align: right; padding-right: 15px;">TOTAL PIEZAS:</td>
            <td>${orden.totalPiezas}</td>
          </tr>
        `;
      }

      let claseEstado = '';
      let estadoTxt = 'Pendiente de confirmación';
      let btnRecibirAttr = '';
      let btnDespacharAttr = 'disabled class="btn-despachar btn-deshabilitado"';

      if (orden.estado === 'Recibido') {
        claseEstado = 'recibido';
        estadoTxt = 'Pedido Recibido (En preparación)';
        btnRecibirAttr = 'disabled class="btn-recibir btn-deshabilitado"';
        btnDespacharAttr = 'class="btn-despachar"';
      } else if (orden.estado === 'En Camino') {
        claseEstado = 'despachado';
        estadoTxt = 'Orden Despachada y En Camino';
        btnRecibirAttr = 'disabled class="btn-recibir btn-deshabilitado"';
        btnDespacharAttr = 'disabled class="btn-despachar btn-deshabilitado"';
      }

      const cardHTML = `
        <div class="tarjeta-pedido ${claseEstado}" id="prov-orden-${orden.id}">
          <div class="header-pedido">
            <span class="titulo-orden">Orden #${orden.id}</span>
            <span class="badge-tipo">${orden.zona}</span>
          </div>

          <table class="tabla-piezas">
            <thead>
              <tr>
                <th>Código Pieza</th>
                <th>Color</th>
                <th>Pines / Tamaño</th>
                <th>Descripción Componente</th>
                <th>Cantidad Total</th>
              </tr>
            </thead>
            <tbody>
              ${filasHTML}
            </tbody>
          </table>

          <div class="acciones-btn">
            <button id="btn-recibir-${orden.id}" ${btnRecibirAttr} onclick="marcarRecibido(${orden.id})">
              1. Confirmar Recibido
            </button>
            <button id="btn-despachar-${orden.id}" ${btnDespacharAttr} onclick="marcarDespachado(${orden.id})">
              2. Enviar / En Camino
            </button>
          </div>

          <div class="estado-texto-prov" id="estado-prov-${orden.id}">${estadoTxt}</div>
        </div>
      `;

      // Insertar al final del contenedor (orden cronológico 1, 2, 3...)
      contenedor.innerHTML += cardHTML;
    }

    function marcarRecibido(id) { socket.emit('pedido_recibido', id); }
    function marcarDespachado(id) { socket.emit('despachar_pedido', id); }

    socket.on('orden_recibida_proveedor', (id) => {
      const tarjeta = document.getElementById(`prov-orden-${id}`);
      const btnRecibir = document.getElementById(`btn-recibir-${id}`);
      const btnDespachar = document.getElementById(`btn-despachar-${id}`);
      const estadoTxt = document.getElementById(`estado-prov-${id}`);

      if (tarjeta) {
        tarjeta.className = "tarjeta-pedido recibido";
        btnRecibir.disabled = true;
        btnRecibir.className = "btn-recibir btn-deshabilitado";
        btnDespachar.disabled = false;
        btnDespachar.className = "btn-despachar";
        estadoTxt.innerText = "Pedido Recibido (En preparación)";
      }
    });

    socket.on('orden_despachada_proveedor', (id) => {
      const tarjeta = document.getElementById(`prov-orden-${id}`);
      const btnDespachar = document.getElementById(`btn-despachar-${id}`);
      const estadoTxt = document.getElementById(`estado-prov-${id}`);

      if (tarjeta) {
        tarjeta.className = "tarjeta-pedido despachado";
        btnDespachar.disabled = true;
        btnDespachar.className = "btn-despachar btn-deshabilitado";
        estadoTxt.innerText = "Orden Despachada y En Camino";
      }
    });
  </script>
</body>
</html>
