<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proveedor - Gestión de Pedidos</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f7fafc;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 { color: #1a202c; font-size: 28px; margin-bottom: 30px; }
    .pedidos-container { width: 100%; max-width: 650px; }

    .tarjeta-pedido {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      border-left: 6px solid #a0aec0;
    }

    .tarjeta-pedido.recibido { border-left-color: #d69e2e; }
    .tarjeta-pedido.despachado { border-left-color: #38a169; }

    .header-pedido {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 8px;
    }

    .titulo-orden { font-size: 20px; font-weight: bold; color: #2d3748; }
    .badge-zona {
      background-color: #edf2f7;
      color: #4a5568;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    /* Tablas dentro de los pedidos */
    table.tabla-detalle {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0 18px 0;
      font-size: 14px;
    }

    table.tabla-detalle th, table.tabla-detalle td {
      border: 1px solid #e2e8f0;
      padding: 8px 12px;
      text-align: left;
    }

    table.tabla-detalle th {
      background-color: #f8fafc;
      color: #4a5568;
      font-weight: 600;
    }

    .acciones-btn { display: flex; gap: 12px; }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-recibir { background-color: #d69e2e; color: white; }
    .btn-despachar { background-color: #38a169; color: white; }
    .btn-deshabilitado { background-color: #cbd5e0 !important; cursor: not-allowed; }

    .estado-texto-prov { font-weight: bold; margin-top: 10px; font-size: 15px; }
  </style>
</head>
<body>

  <h2>Proveedor: Solicitudes de Almacén</h2>
  <div class="pedidos-container" id="lista-pedidos"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    socket.on('cargar_pedidos_iniciales', (pedidos) => {
      const contenedor = document.getElementById('lista-pedidos');
      contenedor.innerHTML = '';
      pedidos.forEach(orden => agregarTarjetaProveedor(orden));
    });

    socket.on('nuevo_pedido_proveedor', (orden) => {
      agregarTarjetaProveedor(orden, true);
    });

    function agregarTarjetaProveedor(orden, alInicio = false) {
      const contenedor = document.getElementById('lista-pedidos');

      let tablaHTML = '';

      if (orden.zona === 'Pedido Normal' || !orden.bloques || orden.bloques.length === 0) {
        tablaHTML = `
          <table class="tabla-detalle">
            <thead>
              <tr><th>Producto</th><th>Cantidad Solicitada</th></tr>
            </thead>
            <tbody>
              <tr><td><strong>PINDO</strong></td><td>${orden.pindo} unidad(es)</td></tr>
              <tr><td><strong>SAYO</strong></td><td>${orden.sanyo} unidad(es)</td></tr>
            </tbody>
          </table>
        `;
      } else {
        tablaHTML = `
          <table class="tabla-detalle">
            <thead>
              <tr><th>Producto</th><th>Bloques Requeridos (Por Zona)</th></tr>
            </thead>
            <tbody>
        `;
        orden.bloques.forEach(grupo => {
          tablaHTML += `
            <tr>
              <td><strong>${grupo.producto}</strong></td>
              <td>${grupo.bloques.join('<br>')}</td>
            </tr>
          `;
        });
        tablaHTML += `</tbody></table>`;
      }

      let claseEstado = '';
      let estadoTxt = 'Pendiente de confirmación';
      let btnRecibirAttr = '';
      let btnDespacharAttr = 'disabled class="btn-despachar btn-deshabilitado"';

      if (orden.estado === 'Recibido') {
        claseEstado = 'recibido';
        estadoTxt = 'Pedido Recibido (En preparación)';
        btnRecibirAttr = 'disabled class="btn-recibir btn-deshabilitado"';
        btnDespacharAttr = 'class="btn-despachar"';
      } else if (orden.estado === 'En Camino') {
        claseEstado = 'despachado';
        estadoTxt = 'Orden Despachada y En Camino';
        btnRecibirAttr = 'disabled class="btn-recibir btn-deshabilitado"';
        btnDespacharAttr = 'disabled class="btn-despachar btn-deshabilitado"';
      }

      const cardHTML = `
        <div class="tarjeta-pedido ${claseEstado}" id="prov-orden-${orden.id}">
          <div class="header-pedido">
            <span class="titulo-orden">Orden #${orden.id}</span>
            <span class="badge-zona">${orden.zona}</span>
          </div>

          ${tablaHTML}

          <div class="acciones-btn">
            <button id="btn-recibir-${orden.id}" ${btnRecibirAttr} onclick="marcarRecibido(${orden.id})">
              1. Confirmar Recibido
            </button>
            <button id="btn-despachar-${orden.id}" ${btnDespacharAttr} onclick="marcarDespachado(${orden.id})">
              2. Enviar / En Camino
            </button>
          </div>

          <div class="estado-texto-prov" id="estado-prov-${orden.id}">${estadoTxt}</div>
        </div>
      `;

      if (alInicio) {
        contenedor.innerHTML = cardHTML + contenedor.innerHTML;
      } else {
        contenedor.innerHTML += cardHTML;
      }
    }

    function marcarRecibido(id) { socket.emit('pedido_recibido', id); }
    function marcarDespachado(id) { socket.emit('despachar_pedido', id); }

    socket.on('orden_recibida_proveedor', (id) => {
      const tarjeta = document.getElementById(`prov-orden-${id}`);
      const btnRecibir = document.getElementById(`btn-recibir-${id}`);
      const btnDespachar = document.getElementById(`btn-despachar-${id}`);
      const estadoTxt = document.getElementById(`estado-prov-${id}`);

      if (tarjeta) {
        tarjeta.className = "tarjeta-pedido recibido";
        btnRecibir.disabled = true;
        btnRecibir.className = "btn-recibir btn-deshabilitado";
        btnDespachar.disabled = false;
        btnDespachar.className = "btn-despachar";
        estadoTxt.innerText = "Pedido Recibido (En preparación)";
      }
    });

    socket.on('orden_despachada_proveedor', (id) => {
      const tarjeta = document.getElementById(`prov-orden-${id}`);
      const btnDespachar = document.getElementById(`btn-despachar-${id}`);
      const estadoTxt = document.getElementById(`estado-prov-${id}`);

      if (tarjeta) {
        tarjeta.className = "tarjeta-pedido despachado";
        btnDespachar.disabled = true;
        btnDespachar.className = "btn-despachar btn-deshabilitado";
        estadoTxt.innerText = "Orden Despachada y En Camino";
      }
    });
  </script>
</body>
</html>
