<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almacén - Crear Pedido</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 { color: #1a202c; font-size: 28px; margin-bottom: 25px; text-align: center; }

    .formulario-container {
      background-color: #f8fafc;
      padding: 20px 30px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin-bottom: 30px;
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .campo-form { display: flex; flex-direction: column; gap: 6px; }
    .campo-form label { font-weight: bold; color: #2d3748; font-size: 15px; }
    .campo-form input, .campo-form select { 
      padding: 10px 12px; font-size: 15px; border-radius: 6px; border: 1px solid #cbd5e0; outline: none; 
    }

    .grid-productos {
      display: flex;
      gap: 40px;
      margin-bottom: 25px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .producto-card { width: 280px; display: flex; flex-direction: column; }
    .producto-card img {
      width: 100%; height: 180px; object-fit: cover; margin-bottom: 15px;
      border-radius: 6px; border: 1px solid #e2e8f0; background-color: #f8fafc;
    }

    label { font-weight: 600; color: #4a5568; font-size: 14px; margin-bottom: 8px; }
    input { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 16px; box-sizing: border-box; outline: none; }

    button.btn-enviar {
      width: 100%; max-width: 500px; padding: 16px; background-color: #0056b3;
      color: white; border: none; border-radius: 6px; font-size: 18px; font-weight: bold;
      cursor: pointer; margin-bottom: 40px; transition: background-color 0.2s;
    }
    button.btn-enviar:hover { background-color: #004494; }

    .historial-container {
      background-color: #f1f4f9; padding: 30px; border-radius: 8px;
      width: 100%; max-width: 750px; box-sizing: border-box;
    }

    .historial-container h3 { margin-top: 0; margin-bottom: 20px; color: #1a202c; font-size: 20px; }

    .item-historial {
      background: white; border: 1px solid #e2e8f0; border-left: 6px solid #a0aec0;
      padding: 18px; border-radius: 6px; margin-bottom: 15px;
      transition: opacity 0.5s ease;
    }

    .item-historial.recibido { border-left-color: #d69e2e; }
    .item-historial.despachado { border-left-color: #38a169; }

    .item-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .orden-texto { color: #1a202c; font-weight: bold; font-size: 17px; }

    .estado-badge { font-weight: bold; font-size: 14px; }
    .estado-pendiente { color: #a0aec0; }
    .estado-recibido { color: #d69e2e; }
    .estado-camino { color: #38a169; }

    table.tabla-almacen {
      width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px;
    }
    table.tabla-almacen th, table.tabla-almacen td {
      border: 1px solid #e2e8f0; padding: 6px 8px; text-align: center;
    }
    table.tabla-almacen th { background-color: #f8fafc; color: #4a5568; }
  </style>
</head>
<body>

  <h2>Almacén: Enviar Pedido</h2>

  <div class="formulario-container">
    <div class="campo-form">
      <label for="nombre-pedido">Nombre / Identificador del Pedido:</label>
      <input type="text" id="nombre-pedido" placeholder="Ej. Lote Planta A, Pedido Urgente..." autofocus>
    </div>
    
    <div class="campo-form">
      <label for="select-zona">Tipo de Solicitud:</label>
      <select id="select-zona" onchange="actualizarPreseleccion()">
        <option value="Pedido Normal" selected>Pedido Normal</option>
        <option value="Zona 1">Zona 1</option>
        <option value="Zona 2">Zona 2</option>
        <option value="Zona 3">Zona 3</option>
        <option value="Zona 4">Zona 4</option>
      </select>
    </div>
  </div>

  <div class="grid-productos">
    <div class="producto-card">
      <img src="Pindo.jpeg" onerror="probarVariaciones(this, 'Pindo')" alt="PINDO">
      <label>Cantidad PINDO:</label>
      <input type="number" id="pindo" value="0" min="0">
    </div>
    <div class="producto-card">
      <img src="Sayo.jpeg" onerror="probarVariaciones(this, 'Sayo')" alt="SAYO">
      <label>Cantidad SAYO:</label>
      <input type="number" id="sanyo" value="0" min="0">
    </div>
  </div>

  <button class="btn-enviar" onclick="enviarPedido()">Enviar Orden a Proveedor</button>

  <div class="historial-container">
    <h3>Historial de Pedidos Enviados</h3>
    <div id="historial-pedidos"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function probarVariaciones(img, nombre) {
      const opciones = [
        `${nombre}.jpeg`, `${nombre}.jpg`, `${nombre}.png`,
        `${nombre.toLowerCase()}.jpeg`, `${nombre.toLowerCase()}.jpg`, `${nombre.toLowerCase()}.png`
      ];
      let idx = parseInt(img.getAttribute('data-try') || '0');
      if (idx < opciones.length) {
        img.setAttribute('data-try', idx + 1);
        img.src = opciones[idx];
      }
    }

    function actualizarPreseleccion() {
      const zona = document.getElementById('select-zona').value;
      if (zona !== "Pedido Normal") {
        document.getElementById('pindo').value = "1";
        document.getElementById('sanyo').value = "1";
      }
    }

    function enviarPedido() {
      const nombrePedido = document.getElementById('nombre-pedido').value;
      const pindo = document.getElementById('pindo').value;
      const sanyo = document.getElementById('sanyo').value;
      const zona = document.getElementById('select-zona').value;
      
      if (pindo == 0 && sanyo == 0) {
        alert("Ingresa al menos un producto.");
        return;
      }
      
      socket.emit('nuevo_pedido', { nombrePedido, pindo, sanyo, zona });
      document.getElementById('nombre-pedido').value = '';
    }

    socket.on('cargar_pedidos_iniciales', (pedidos) => {
      const contenedor = document.getElementById('historial-pedidos');
      contenedor.innerHTML = '';
      pedidos.forEach(orden => agregarTarjetaAlmacen(orden, false));
    });

    socket.on('orden_confirmada_almacen', (orden) => {
      agregarTarjetaAlmacen(orden, true);
    });

    socket.on('orden_recibida_almacen', (idOrden) => {
      const tarjeta = document.getElementById(`almacen-orden-${idOrden}`);
      const badge = document.getElementById(`badge-almacen-${idOrden}`);
      if (tarjeta && badge) {
        tarjeta.className = "item-historial recibido";
        badge.innerText = "Proveedor confirmó recepción (En preparación)";
        badge.className = "estado-badge estado-recibido";
      }
    });

    socket.on('orden_despachada_almacen', (idOrden) => {
      const tarjeta = document.getElementById(`almacen-orden-${idOrden}`);
      const badge = document.getElementById(`badge-almacen-${idOrden}`);
      if (tarjeta && badge) {
        tarjeta.className = "item-historial despachado";
        badge.innerText = "En camino (Se eliminará en 10s)";
        badge.className = "estado-badge estado-camino";
      }
    });

    socket.on('eliminar_pedido', (idOrden) => {
      const tarjeta = document.getElementById(`almacen-orden-${idOrden}`);
      if (tarjeta) {
        tarjeta.style.opacity = '0';
        setTimeout(() => tarjeta.remove(), 500);
      }
    });

    function agregarTarjetaAlmacen(orden, alInicio = true) {
      const contenedor = document.getElementById('historial-pedidos');

      let filasPzs = '';
      if (orden.piezas && orden.piezas.length > 0) {
        orden.piezas.forEach(p => {
          filasPzs += `
            <tr>
              <td>${p.codigo}</td>
              <td style="text-align:left;">${p.descripcion}</td>
              <td><strong>${p.cantidadTotal}</strong></td>
            </tr>
          `;
        });
      }

      let claseEstado = '';
      let badgeTxt = 'Esperando confirmación...';
      let badgeClase = 'estado-badge estado-pendiente';

      if (orden.estado === 'Recibido') {
        claseEstado = 'recibido';
        badgeTxt = 'Proveedor confirmó recepción (En preparación)';
        badgeClase = 'estado-badge estado-recibido';
      } else if (orden.estado === 'En Camino') {
        claseEstado = 'despachado';
        badgeTxt = 'En camino (Se eliminará en 10s)';
        badgeClase = 'estado-badge estado-camino';
      }

      const itemHTML = `
        <div class="item-historial ${claseEstado}" id="almacen-orden-${orden.id}">
          <div class="item-header">
            <span class="orden-texto">${orden.nombre} [${orden.zona}]</span>
            <span class="${badgeClase}" id="badge-almacen-${orden.id}">${badgeTxt}</span>
          </div>
          <div style="font-size:13px; color:#4a5568; margin-bottom: 8px;">
            <strong>Solicitud Interna:</strong> ${orden.pindo} PINDO, ${orden.sanyo} SAYO | <strong>Total Piezas:</strong> ${orden.totalPiezas}
          </div>
          <table class="tabla-almacen">
            <thead>
              <tr><th>Código</th><th>Descripción</th><th>Total Piezas</th></tr>
            </thead>
            <tbody>
              ${filasPzs}
            </tbody>
          </table>
        </div>
      `;

      if (alInicio) {
        contenedor.innerHTML = itemHTML + contenedor.innerHTML;
      } else {
        contenedor.innerHTML += itemHTML;
      }
    }
  </script>
</body>
</html>
