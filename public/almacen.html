<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almacén - Control de Pedidos</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f7fafc;
      margin: 0;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 { color: #1a202c; margin-bottom: 20px; }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 1100px;
    }

    @media (max-width: 850px) {
      .grid-container { grid-template-columns: 1fr; }
    }

    .panel {
      background: white;
      border-radius: 8px;
      padding: 20px;
      border: 1px solid #cbd5e0;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .panel-header {
      font-size: 18px;
      font-weight: bold;
      color: #2b6cb0;
      margin-bottom: 15px;
      border-bottom: 2px solid #ebf8ff;
      padding-bottom: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
    }

    label { font-size: 13px; font-weight: bold; color: #4a5568; }

    select, input[type="number"], input[type="text"] {
      padding: 10px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-primary { background-color: #3182ce; color: white; }
    .btn-primary:hover { background-color: #2b6cb0; }

    .btn-warning { background-color: #dd6b20; color: white; }
    .btn-warning:hover { background-color: #c05621; }

    .btn-danger { background-color: #e53e3e; color: white; }

    .tabla-borrador {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      margin-bottom: 15px;
    }

    .tabla-borrador th, .tabla-borrador td {
      border: 1px solid #e2e8f0;
      padding: 8px;
      text-align: left;
      font-size: 13px;
    }

    .tabla-borrador th { background-color: #edf2f7; }

    .badge-sobrante {
      background-color: #c6f6d5;
      color: #22543d;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
      margin-right: 5px;
      margin-bottom: 5px;
    }

    .checkbox-reposicion {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff5f5;
      border: 1px solid #feb2b2;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .tarjeta-pedido-almacen {
      background: #f7fafc;
      border: 1px solid #cbd5e0;
      border-left: 5px solid #a0aec0;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .tarjeta-pedido-almacen.reposicion {
      border-left-color: #e53e3e;
      background: #fff5f5;
    }

    .tarjeta-pedido-almacen.en-camino {
      border-left-color: #38a169;
    }
  </style>
</head>
<body>

  <h2>Almacén: Gestión de Pedidos e Inventario</h2>

  <div class="grid-container">
    
    <!-- PANEL IZQUIERDO: CREAR PEDIDO Y REGISTRAR SOBRANTE -->
    <div>
      <div class="panel">
        <div class="panel-header">1. Armar Pedido a Proveedor</div>

        <div class="form-group">
          <label>Seleccionar Pieza:</label>
          <select id="select-pieza"></select>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
          <div class="form-group" style="flex: 1;">
            <label>Cantidad:</label>
            <input type="number" id="cant-pieza" min="1" value="1">
          </div>
          <button class="btn btn-primary" style="align-self: flex-end; height: 40px;" onclick="agregarPiezaBorrador()">
            + Agregar al Pedido
          </button>
        </div>

        <!-- TABLA TEMPORAL DEL PEDIDO -->
        <table class="tabla-borrador">
          <thead>
            <tr>
              <th>Pieza</th>
              <th>Cant</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="body-borrador"></tbody>
        </table>

        <!-- OPCIÓN DE REPOSICIÓN -->
        <div class="checkbox-reposicion">
          <input type="checkbox" id="check-reposicion" onchange="toggleRefOrden()">
          <label for="check-reposicion" style="color: #9b2c2c;">¿Es una Orden de Reposición (Prioritaria)?</label>
        </div>

        <div class="form-group" id="group-ref-orden" style="display: none;">
          <label>Número u Orden de Referencia (Ej: Reposición Orden #2):</label>
          <input type="text" id="ref-orden" placeholder="Ej. Orden #2 inconforme">
        </div>

        <button class="btn btn-warning" style="width: 100%; padding: 12px; font-size: 15px;" onclick="enviarPedidoFinal()">
          🚀 Enviar Pedido a Proveedor
        </button>
      </div>

      <!-- REGISTRO DE PIEZAS SOBRANTES EN ALMACÉN -->
      <div class="panel" style="margin-top: 20px;">
        <div class="panel-header" style="color: #dd6b20; border-bottom-color: #feebc8;">
          2. Registrar Pieza Sobrante / Equivocada
        </div>
        <p style="font-size: 12px; color: #718096; margin-top: -10px;">
          Si llegó una pieza equivocada, regístrala aquí. El sistema la descontará automáticamente del próximo pedido.
        </p>

        <div class="form-group">
          <label>Pieza que llegó sobrante:</label>
          <select id="select-sobrante"></select>
        </div>

        <div style="display: flex; gap: 10px;">
          <input type="number" id="cant-sobrante" min="1" value="1" style="width: 100px;">
          <button class="btn btn-warning" style="flex: 1;" onclick="registrarSobrante()">
            Guardar en Stock de Almacén
          </button>
        </div>

        <div style="margin-top: 15px;">
          <label>Stock de Retención Actual:</label>
          <div id="contenedor-sobrantes" style="margin-top: 5px;"></div>
        </div>
      </div>
    </div>

    <!-- PANEL DERECHO: HISTORIAL DE PEDIDOS -->
    <div class="panel">
      <div class="panel-header" style="color: #2d3748; border-bottom-color: #edf2f7;">
        3. Historial de Pedidos Realizados
      </div>
      <div id="lista-historial"></div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let catalogo = [];
    let borradorPedido = [];

    socket.on('cargar_catalogo', (datosCatalogo) => {
      catalogo = datosCatalogo;
      const selectPieza = document.getElementById('select-pieza');
      const selectSobrante = document.getElementById('select-sobrante');
      
      selectPieza.innerHTML = '';
      selectSobrante.innerHTML = '';

      catalogo.forEach(p => {
        const option = `<option value="${p.codigo}">${p.codigo} - ${p.descripcion}</option>`;
        selectPieza.innerHTML += option;
        selectSobrante.innerHTML += option;
      });
    });

    socket.on('actualizar_sobrantes', (inventarioSobrante) => {
      const contenedor = document.getElementById('contenedor-sobrantes');
      contenedor.innerHTML = '';

      let haySobrantes = false;
      for (const [codigo, cantidad] of Object.entries(inventarioSobrante)) {
        if (cantidad > 0) {
          haySobrantes = true;
          contenedor.innerHTML += `<span class="badge-sobrante">${codigo}: ${cantidad} und</span>`;
        }
      }

      if (!haySobrantes) {
        contenedor.innerHTML = '<span style="font-size:12px; color:#a0aec0;">Sin piezas retenidas.</span>';
      }
    });

    socket.on('actualizar_lista_pedidos', (pedidos) => {
      const historial = document.getElementById('lista-historial');
      historial.innerHTML = '';

      pedidos.forEach(p => {
        let esRepo = p.esReposicion ? 'reposicion' : '';
        let enCamino = p.estado === 'En Camino' ? 'en-camino' : '';
        
        let badgeEstado = `<b style="color:#d69e2e;">${p.estado}</b>`;
        if (p.estado === 'En Camino') badgeEstado = `<b style="color:#38a169;">En Camino 🚚</b>`;
        if (p.estado === 'Recibido') badgeEstado = `<b style="color:#3182ce;">En Preparación 📦</b>`;

        let tagRepo = p.esReposicion ? `<span style="background:#e53e3e; color:white; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:bold;">REPOSICIÓN</span>` : '';

        let resumenPiezas = p.piezas.map(item => `${item.descripcion} (x${item.cantidadOriginal})`).join('<br>');

        historial.innerHTML += `
          <div class="tarjeta-pedido-almacen ${esRepo} ${enCamino}">
            <div style="display:flex; justify-between; align-items:center; margin-bottom: 5px;">
              <strong>Orden #${p.id} ${tagRepo}</strong>
              <span style="font-size:12px;">${badgeEstado}</span>
            </div>
            <div style="font-size:12px; color:#4a5568; margin-bottom: 5px;">${resumenPiezas}</div>
            ${p.ordenRef ? `<div style="font-size:11px; color:#c53030;"><strong>Ref:</strong> ${p.ordenRef}</div>` : ''}
          </div>
        `;
      });
    });

    function toggleRefOrden() {
      const check = document.getElementById('check-reposicion').checked;
      document.getElementById('group-ref-orden').style.display = check ? 'flex' : 'none';
    }

    function agregarPiezaBorrador() {
      const cod = document.getElementById('select-pieza').value;
      const cant = parseInt(document.getElementById('cant-pieza').value) || 1;
      const piezaObj = catalogo.find(p => p.codigo === cod);

      if (!piezaObj) return;

      const existe = borradorPedido.find(p => p.codigo === cod);
      if (existe) {
        existe.cantidad += cant;
      } else {
        borradorPedido.push({
          codigo: piezaObj.codigo,
          descripcion: piezaObj.descripcion,
          cantidad: cant
        });
      }

      renderBorrador();
    }

    function renderBorrador() {
      const body = document.getElementById('body-borrador');
      body.innerHTML = '';

      borradorPedido.forEach((item, index) => {
        body.innerHTML += `
          <tr>
            <td>${item.descripcion}</td>
            <td><strong>${item.cantidad}</strong></td>
            <td><button style="color:red; border:none; background:none; cursor:pointer;" onclick="eliminarDelBorrador(${index})">❌</button></td>
          </tr>
        `;
      });
    }

    function eliminarDelBorrador(index) {
      borradorPedido.splice(index, 1);
      renderBorrador();
    }

    function enviarPedidoFinal() {
      if (borradorPedido.length === 0) {
        alert('Agrega al menos una pieza al pedido.');
        return;
      }

      const esReposicion = document.getElementById('check-reposicion').checked;
      const ordenRef = document.getElementById('ref-orden').value;

      socket.emit('nuevo_pedido_custom', {
        piezas: borradorPedido,
        esReposicion: esReposicion,
        ordenRef: ordenRef
      });

      // Limpiar borrador
      borradorPedido = [];
      renderBorrador();
      document.getElementById('check-reposicion').checked = false;
      document.getElementById('ref-orden').value = '';
      toggleRefOrden();
    }

    function registrarSobrante() {
      const cod = document.getElementById('select-sobrante').value;
      const cant = parseInt(document.getElementById('cant-sobrante').value) || 1;
      socket.emit('registrar_sobrante', { codigo: cod, cantidad: cant });
    }
  </script>
</body>
</html>
